<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secret Letter 💌</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe6f0, #fff);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ENVELOPE */
.envelope {
    width: 240px;
    height: 160px;
    position: relative;
    cursor: pointer;
    transition: 0.6s ease;
}

.envelope-back {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #ff2f55;
    border-radius: 10px;
}

.envelope-front {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: #ff4d6d;
    clip-path: polygon(0 40%, 50% 65%, 100% 40%, 100% 100%, 0 100%);
}

.flap {
    position: absolute;
    top: 0;
    width: 100%;
    height: 50%;
    background: #ff1f4b;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transition: 0.6s ease;
}

.envelope.open {
    transform: translateY(-20px) scale(0.95);
    opacity: 0;
    pointer-events: none;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* CODE SCREEN */
.screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

input {
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    width: 200px;
    text-align: center;
}

button {
    margin-top: 10px;
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: #ff4d6d;
    color: white;
}

/* TAP */
.tapOverlay {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    font-size: 16px;
    color: #ff4d6d;
    background: rgba(255,255,255,0.6);
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
}

/* PAPERS */
.paper {
    position: absolute;
    width: 320px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    text-align: center;
    transition: 0.8s ease;
    opacity: 0;
    transform: translateY(60px) scale(0.9);
}

.paper.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.paper.front { z-index: 3; }
.paper.back { z-index: 2; opacity: 0.5; }

.paper h2 {
    color: #ff4d6d;
}

.hint {
    margin-top: 15px;
    font-size: 13px;
    color: #ff4d6d;
    text-decoration: underline;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div id="envelope" class="envelope">
    <div class="envelope-back"></div>
    <div class="envelope-front"></div>
    <div class="flap"></div>
</div>

<!-- CODE -->
<div id="codeScreen" class="screen">
    <h3>Enter Code 💌</h3>
    <input type="password" id="codeInput" placeholder="Enter code...">
    <button onclick="checkCode()">Unlock</button>
</div>

<!-- TAP -->
<div id="tapOverlay" class="tapOverlay">
    Tap anywhere 💖
</div>

<!-- PAPER 1 -->
<div id="paper1" class="paper">
    <h2>💖 To Lovely</h2>
    <p>
        I’ve been thinking about this for a long time because I wasn’t sure what I really felt.<br><br>
        Now I’m sure—I like you.
    </p>
</div>

<!-- PAPER 2 -->
<div id="paper2" class="paper">
    <h2>💌 Message</h2>
    <p>Can I court you?</p>

    <div class="hint" id="backBtn">
        Tap to read the first paper
    </div>
</div>

<script>
const envelope = document.getElementById("envelope");
const codeScreen = document.getElementById("codeScreen");
const paper1 = document.getElementById("paper1");
const paper2 = document.getElementById("paper2");
const tapOverlay = document.getElementById("tapOverlay");
const backBtn = document.getElementById("backBtn");

const secretCode = "1115";

/* open */
envelope.addEventListener("click", () => {
    envelope.classList.add("open");

    setTimeout(() => {
        envelope.style.display = "none";
        codeScreen.style.display = "flex";
        document.getElementById("codeInput").focus();
    }, 600);
});

/* code */
function checkCode() {
    const input = document.getElementById("codeInput");

    if (input.value === secretCode) {
        codeScreen.style.display = "none";

        paper1.classList.add("show", "front");

        setTimeout(() => {
            tapOverlay.style.display = "block";
        }, 600);

    } else {
        alert("Wrong code 💔 Try again");
        input.value = "";
        input.focus();
    }
}

/* show paper 2 */
tapOverlay.addEventListener("click", () => {
    tapOverlay.style.display = "none";

    paper2.classList.add("show", "front");

    setTimeout(() => {
        paper1.classList.remove("front");
        paper1.classList.add("back");
    }, 200);
});

/* back to paper 1 */
backBtn.addEventListener("click", () => {
    paper2.classList.remove("show", "front");

    paper1.classList.remove("back");
    paper1.classList.add("show", "front");
});
</script>

</body>
</html>
